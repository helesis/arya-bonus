<head>

<title>Arya’nın LGS karnesi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%2324262B' stroke='%23D9466F' stroke-width='4'/%3E%3Ctext x='32' y='44' font-family='sans-serif' font-size='32' font-weight='bold' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<style>
  :root { --paper:#FCFCFA; --ink:#24262B; --muted:#6A6E76; --line:#E4E5E7; --card:#fff; --form:#D9466F; --red:#B3261E; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--paper); color:var(--ink); font:15px/1.5 system-ui, -apple-system, sans-serif; }
  form { width:100%; max-width:340px; background:var(--card); border:1px solid var(--line);
         border-radius:16px; padding:26px 22px; box-shadow:0 8px 30px rgba(23,27,34,.06); }
  .logo { width:48px; height:48px; border-radius:50%; border:2px solid var(--form);
          background:radial-gradient(circle at 38% 32%, #4A4D55, var(--ink) 68%); color:#fff;
          display:grid; place-items:center; font-weight:800; font-size:22px; margin-bottom:16px; }
  h1 { font-size:19px; margin:0 0 4px; }
  p { margin:0 0 16px; color:var(--muted); font-size:13.5px; }
  input[type=password] { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line);
         border-radius:10px; outline:none; }
  input[type=password]:focus { border-color:var(--ink); box-shadow:0 0 0 3px rgba(36,38,43,.12); }
  label.hatirla { display:flex; gap:8px; align-items:center; margin:12px 0 16px; font-size:13.5px; color:var(--muted); }
  button { width:100%; font:inherit; font-weight:600; padding:10px; border:0; border-radius:10px;
           background:var(--ink); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .hata { color:var(--red); font-size:13px; margin-top:10px; min-height:1.3em; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <div class="logo" aria-hidden="true">A</div>
  <h1>Arya’nın LGS karnesi</h1>
  <p>Sayfa şifreli. Görmek için şifreyi girin.</p>
  <input type="text" name="username" value="arya" autocomplete="username" hidden>
  <input type="password" id="s" autocomplete="current-password" placeholder="Şifre" required autofocus>
  <label class="hatirla"><input type="checkbox" id="h"> Bu cihazda hatırla</label>
  <button id="b" type="submit">Aç</button>
  <div class="hata" id="e" role="alert"></div>
</form>

const ANAHTAR = "aryaSiteAnahtar";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const yaz = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));

/* Tek anahtar türetilir (ortak tuz), sonra her sürüm denenir:
   ebeveyn şifresi tam sürümü, Arya'nın şifresi yönetici paneli olmayan sürümü açar */
async function anahtarTuret(sifre) {
  const ham = await crypto.subtle.importKey("raw", new TextEncoder().encode(sifre), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.tur, hash: "SHA-256" },
    ham, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function coz(anahtar) {
  for (const s of P.surumler) {
    try {
      const acik = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(s.iv) }, anahtar, b64(s.veri));
      return new TextDecoder().decode(acik);
    } catch (_) { /* bu sürümün şifresi değil */ }
  }
  throw new Error("şifre yanlış");
}
/* Giriş sayfası tam ayrıştırılmadan document.write yapılırsa iki sayfa
   birbirine karışır → önce ayrıştırmanın bitmesini bekle */
async function goster(html) {
  if (document.readyState === "loading")
    await new Promise(r => document.addEventListener("DOMContentLoaded", r, { once: true }));
  document.open(); document.write(html); document.close();
}

/* Hatırlanan anahtar (yalnızca türetilmiş anahtar saklanır, şifre değil) */
(async () => {
  try {
    const kayit = JSON.parse(localStorage.getItem(ANAHTAR) || "null");
    if (!kayit || kayit.salt !== P.salt) return;
    const k = await crypto.subtle.importKey("raw", b64(kayit.k), "AES-GCM", false, ["decrypt"]);
    goster(await coz(k));
  } catch (e) { try { localStorage.removeItem(ANAHTAR); } catch (_) {} }
})();

document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = document.getElementById("b"), err = document.getElementById("e");
  btn.disabled = true; btn.textContent = "Açılıyor…"; err.textContent = "";
  try {
    const k = await anahtarTuret(document.getElementById("s").value);
    const html = await coz(k);
    if (document.getElementById("h").checked) {
      try { localStorage.setItem(ANAHTAR, JSON.stringify({ salt: P.salt, k: yaz(await crypto.subtle.exportKey("raw", k)) })); } catch (_) {}
    }
    goster(html);
  } catch (e) {
    err.textContent = "Şifre yanlış.";
    btn.disabled = false; btn.textContent = "Aç";
    document.getElementById("s").select();
  }
});
</script>
